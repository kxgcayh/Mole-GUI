name: mole_gui
description: "A native macOS Flutter GUI for Mole CLI (https://github.com/tw93/mole)."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.3
  go_router: ^17.5.0
  logger: ^2.5.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
